name: Build LiteWin EXO
on:
  push:
    branches: [litewin-exo-build-20261109]
jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Recreate source
        shell: pwsh
        run: |
          [IO.File]::WriteAllBytes("litewin.py",[Convert]::FromBase64String(""))
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install PyInstaller
        run: python -m pip install --upgrade pyinstaller
      - name: Build EXE
        run: python -m PyInstaller --noconfirm --onefile --windowed --uac-admin --name LiteWinPython_EXO litewin.py
      - uses: actions/upload-artifact@v4
        with:
          name: LiteWinPython_EXO
          path: dist/LiteWinPython_EXO.exe
          if-no-files-found: error
